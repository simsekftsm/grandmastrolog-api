openapi: 3.1.0
info:
  title: GrandMastrolog Learning API
  version: 1.1.0
servers:
  - url: https://grandmastrolog-api-production.up.railway.app
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check API health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
  /natal/deliver:
    post:
      operationId: deliverNatal
      summary: Produce a final validated GrandMastrolog Natal delivery
      description: Runs deterministic Swiss Ephemeris evidence through the trusted GrandMastrolog delivery chain and returns only final validated canonical output.
      security:
        - GmSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, birth]
              properties:
                request_id:
                  type: string
                  minLength: 1
                  maxLength: 96
                birth:
                  type: object
                  additionalProperties: false
                  required: [date, time, timezone, latitude, longitude, district, city]
                  properties:
                    date:
                      type: string
                      format: date
                    time:
                      type: string
                      description: Local birth time in HH:MM or HH:MM:SS format.
                    timezone:
                      type: string
                      description: IANA timezone, for example Europe/Istanbul.
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                    district:
                      type: string
                    city:
                      type: string
      responses:
        "200":
          description: Final validated canonical Natal output
          content:
            application/json:
              schema:
                type: object
                required: [ok, request_id, contract_version, delivery_state, delivery_validator_enabled, final_delivery_authorized, output, evidence_sha256, provenance]
                properties:
                  ok:
                    type: boolean
                    const: true
                  request_id:
                    type: string
                  contract_version:
                    type: string
                    const: gm.natal.v1
                  delivery_state:
                    type: string
                    const: final_delivery_validated
                  delivery_validator_enabled:
                    type: boolean
                    const: true
                  final_delivery_authorized:
                    type: boolean
                    const: true
                  output:
                    type: string
                  visual_attachments:
                    type: array
                    items: {}
                  evidence_sha256:
                    type: string
                  provenance:
                    type: object
                    additionalProperties: true
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "422":
          description: Deterministic astro source or semantic contract rejected the request
        "502":
          description: Downstream model, renderer, or delivery runtime failed closed
        "503":
          description: Trusted delivery runtime is unavailable or not authorized
        "504":
          description: Downstream model or delivery runtime timed out
  /context:
    get:
      operationId: getLearningContext
      summary: Get current GrandMastrolog learning context
      security:
        - GmSecret: []
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Learning context
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  learning_enabled:
                    type: boolean
                  gm_runtime_context:
                    type: string
  /feedback:
    post:
      operationId: addFeedback
      summary: Add feedback and generate active calibration note
      security:
        - GmSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                user_id:
                  type: string
                  default: default
                category:
                  type: string
                  default: general
                message:
                  type: string
      responses:
        "200":
          description: Feedback stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  learned:
                    type: boolean
  /learn:
    post:
      operationId: addManualLearning
      summary: Add manual learning note
      security:
        - GmSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                user_id:
                  type: string
                  default: default
                type:
                  type: string
                  default: manual
                content:
                  type: string
      responses:
        "200":
          description: Learning note stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  learned:
                    type: boolean
  /learning/pause:
    post:
      operationId: pauseLearning
      summary: Pause learning mode
      security:
        - GmSecret: []
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  learning_enabled:
                    type: boolean
  /learning/resume:
    post:
      operationId: resumeLearning
      summary: Resume learning mode
      security:
        - GmSecret: []
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  learning_enabled:
                    type: boolean
  /learning/status:
    get:
      operationId: getLearningStatus
      summary: Get learning mode status
      security:
        - GmSecret: []
      responses:
        "200":
          description: Learning status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  learning_enabled:
                    type: boolean
components:
  securitySchemes:
    GmSecret:
      type: apiKey
      in: header
      name: x-gm-secret
