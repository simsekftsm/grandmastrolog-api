name: M1A-5 Blocked Root Diagnostic

on:
  push:
    branches:
      - m1a5-root-repair-runtime-4608
    paths:
      - '.github/workflows/m1a5-blocked-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNTIME_SHA: b5ee123cecdbe220a8db7957a64f881738c07b24
      FROZEN_SHA: fb1f0498cd0a7c49580cfde574a407e00e2bc20b
      VERCEL_URL: https://grandmastrolog-delivery-runtime.vercel.app
      GM_API_SECRET: ${{ secrets.GM_API_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout exact successor state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GM_API_SECRET:-}" || { echo 'BLOCKED:GM_API_SECRET_MISSING'; exit 2; }
          test -n "${GEMINI_API_KEY:-}" || { echo 'BLOCKED:GEMINI_API_KEY_MISSING'; exit 2; }
          git cat-file -e "$RUNTIME_SHA^{commit}"
          git diff --exit-code "$RUNTIME_SHA" HEAD -- delivery_runtime gm_integration integration-server.js openapi.yaml Dockerfile package.json package-lock.json
          git fetch --no-tags --depth=1 origin "$FROZEN_SHA"
          git show "FETCH_HEAD:m1a5_acceptance/corpus.normal-natal.v1.json" > /tmp/corpus.json
          git show "FETCH_HEAD:m1a5_acceptance/frozen-manifest.json" > /tmp/manifest.json
          python3 - <<'PY'
          import hashlib,json
          raw=open('/tmp/corpus.json','rb').read()
          m=json.load(open('/tmp/manifest.json',encoding='utf-8'))
          assert hashlib.sha256(raw).hexdigest()==m['corpus_sha256']
          print('FROZEN_CORPUS_IDENTITY=PASS')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Gemini isolated provider against frozen contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const {buildNatalBindingInput}=require('./gm_integration/natal-evidence.js');
          const {groqGenerationFormat,groqModelInstructions}=require('./delivery_runtime/lib/groq-binding.js');
          const {canonicalizeModelPayload}=require('./delivery_runtime/lib/model-binding.js');
          const {validateBindingInput,makeValidatedEnvelope}=require('./delivery_runtime/lib/natal-contract.js');

          const corpus=JSON.parse(fs.readFileSync('/tmp/corpus.json','utf8'));
          const GAP_MS=20000;
          let lastStart=0;

          async function waitGap(){
            const wait=Math.max(0,GAP_MS-(Date.now()-lastStart));
            if(wait>0){
              console.log('ROOT_DIAG_WAIT_MS='+wait);
              await new Promise(r=>setTimeout(r,wait));
            }
            lastStart=Date.now();
          }

          function sanitizeGeminiSchema(value){
            if(Array.isArray(value)) return value.map(sanitizeGeminiSchema);
            if(!value || typeof value!=='object') return value;
            const out={};
            for(const [key,child] of Object.entries(value)){
              if(['minLength','maxLength','pattern','multipleOf','exclusiveMinimum','exclusiveMaximum','uniqueItems'].includes(key)) continue;
              if(key==='enum' && value.type==='boolean') continue;
              out[key]=sanitizeGeminiSchema(child);
            }
            return out;
          }

          function interactionText(json){
            const parts=[];
            for(const step of json?.steps||[]){
              if(step?.type!=='model_output') continue;
              for(const item of step?.content||[]){
                if(item?.type==='text' && typeof item.text==='string') parts.push(item.text);
              }
            }
            return parts.join('');
          }

          async function geminiCall(t,bi){
            const res=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
              method:'POST',
              headers:{
                'x-goog-api-key':process.env.GEMINI_API_KEY,
                'content-type':'application/json'
              },
              body:JSON.stringify({
                model:'gemini-3.6-flash',
                input:'SEMANTIC_INPUT_JSON:\n'+JSON.stringify(bi.semantic_input),
                system_instruction:groqModelInstructions(bi.availability,bi.verified_evidence),
                response_format:{
                  type:'text',
                  mime_type:'application/json',
                  schema:sanitizeGeminiSchema(groqGenerationFormat(bi.verified_evidence,bi.availability).schema)
                },
                generation_config:{max_output_tokens:8192,seed:0},
                store:false
              }),
              signal:AbortSignal.timeout(90000)
            });
            let json={}; try{json=await res.json()}catch{}
            const err=json?.error||{};
            let parse_ok=false,canonical_validation_ok=false;
            if(res.ok){
              try{
                const parsed=JSON.parse(interactionText(json));
                parse_ok=true;
                const {evidenceMap,availability}=validateBindingInput(bi);
                const canonical=canonicalizeModelPayload(parsed,evidenceMap,availability);
                makeValidatedEnvelope(canonical,evidenceMap,availability);
                canonical_validation_ok=true;
              }catch{}
            }
            console.log('GEMINI_ISOLATED_DIAG '+JSON.stringify({
              case_id:t.case_id,
              status:res.status,
              response_status:json?.status??null,
              parse_ok,
              canonical_validation_ok,
              error_code:err?.code??null,
              error_status:err?.status??null,
              error_message:typeof err?.message==='string'?err.message.slice(0,1000):null,
              error_details:Array.isArray(err?.details)?err.details:null
            }));
            return canonical_validation_ok;
          }

          async function smoke(label, body){
            const res=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
              method:'POST',
              headers:{
                'x-goog-api-key':process.env.GEMINI_API_KEY,
                'content-type':'application/json'
              },
              body:JSON.stringify(body),
              signal:AbortSignal.timeout(90000)
            });
            let json={}; try{json=await res.json()}catch{}
            console.log('GEMINI_SMOKE '+JSON.stringify({
              label,
              status:res.status,
              response_status:json?.status??null,
              error_code:json?.error?.code??null,
              error_status:json?.error?.status??null,
              error_message:typeof json?.error?.message==='string'?json.error.message.slice(0,1000):null,
              has_output_text:typeof json?.output_text==='string' && json.output_text.length>0
            }));
            return {res,json};
          }

          (async()=>{
            await smoke('BASIC',{
              model:'gemini-3.6-flash',
              input:'Reply with the word OK.',
              store:false
            });
            await smoke('SIMPLE_JSON',{
              model:'gemini-3.6-flash',
              input:'Return an object whose ok field is the string yes.',
              response_format:{
                type:'text',
                mime_type:'application/json',
                schema:{
                  type:'object',
                  additionalProperties:false,
                  required:['ok'],
                  properties:{ok:{type:'string',enum:['yes']}}
                }
              },
              store:false
            });
            const t=corpus.cases[0];
            const bi=buildNatalBindingInput({request_id:t.request_id,birth:t.birth}).binding_input;
            await smoke('FULL_GM_SCHEMA',{
              model:'gemini-3.6-flash',
              input:'SEMANTIC_INPUT_JSON:\n'+JSON.stringify(bi.semantic_input),
              system_instruction:groqModelInstructions(bi.availability,bi.verified_evidence),
              response_format:{
                type:'text',
                mime_type:'application/json',
                schema:sanitizeGeminiSchema(groqGenerationFormat(bi.verified_evidence,bi.availability).schema)
              },
              store:false
            });
          })().catch(e=>{
            console.error('GEMINI_SMOKE_ERROR '+String(e?.name||'')+':'+String(e?.message||e));
            process.exit(1);
          });
          NODE
