name: M1A-5 Gemini 3.1 Markdown Root Diagnostic

on:
  push:
    branches:
      - m1a5-root-repair-runtime-4608
    paths:
      - '.github/workflows/m1a5-gemini31-markdown-root.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - name: Diagnose SYN02 markdown escape
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const {buildNatalBindingInput}=require('./gm_integration/natal-evidence.js');
          const {groqGenerationFormat,groqModelInstructions}=require('./delivery_runtime/lib/groq-binding.js');
          const {canonicalizeModelPayload}=require('./delivery_runtime/lib/model-binding.js');
          const {validateBindingInput,makeValidatedEnvelope}=require('./delivery_runtime/lib/natal-contract.js');

          const corpus=JSON.parse(fs.readFileSync('m1a5_acceptance/corpus.normal-natal.v1.json','utf8'));
          const t=corpus.cases.find(x=>x.case_id==='NATAL_SYN_02');
          const bi=buildNatalBindingInput({request_id:t.request_id,birth:t.birth}).binding_input;

          function compactSchema(bi){
            const full=groqGenerationFormat(bi.verified_evidence,bi.availability).schema;
            const specialCount=full.properties.special_contributions.minItems||0;
            const specialEnum=full.$defs.specialContribution.properties.contribution_id.enum||[];
            const refs=(min,max)=>({type:'array',minItems:min,maxItems:max,items:{type:'string'}});
            const paragraphs=(max)=>({type:'array',minItems:1,maxItems:max,items:{type:'string'}});
            const section={
              type:'object',additionalProperties:false,
              required:['section_id','body_paragraphs','hat_evidence_refs'],
              properties:{
                section_id:{type:'string',enum:['profilin','haritanin_ozu','element_dengen','sinerji','senin_yolun','para_kariyer','iliskiler','aile','karmalar']},
                body_paragraphs:paragraphs(6),
                hat_evidence_refs:refs(1,12)
              }
            };
            const special={
              type:'object',additionalProperties:false,
              required:['contribution_id','body_paragraphs','evidence_refs'],
              properties:{
                contribution_id:specialEnum.length?{type:'string',enum:specialEnum}:{type:'string'},
                body_paragraphs:paragraphs(4),
                evidence_refs:refs(1,12)
              }
            };
            return {
              type:'object',additionalProperties:false,
              required:['prelude','pre_seal_sections','personal_seal','main_life_sections','special_contributions'],
              properties:{
                prelude:{type:'object',additionalProperties:false,required:['body_paragraphs','hat_evidence_refs'],properties:{body_paragraphs:paragraphs(4),hat_evidence_refs:refs(1,12)}},
                pre_seal_sections:{type:'array',minItems:5,maxItems:5,items:section},
                personal_seal:{type:'object',additionalProperties:false,required:['motto'],properties:{motto:{type:'string'}}},
                main_life_sections:{type:'array',minItems:4,maxItems:4,items:section},
                special_contributions:{type:'array',minItems:specialCount,maxItems:specialCount,items:special}
              }
            };
          }

          function textFrom(json){
            const p=[];
            for(const step of json?.steps||[]){
              if(step?.type!=='model_output') continue;
              for(const c of step?.content||[]) if(c?.type==='text'&&typeof c.text==='string') p.push(c.text);
            }
            return p.join('');
          }

          function getPath(obj,path){
            if(!path||path==='$') return obj;
            const toks=[];
            path.replace(/^\$\.?/,'').replace(/([^.[\]]+)|\[(\d+)\]/g,(_,a,b)=>{toks.push(a!==undefined?a:Number(b));return ''});
            let cur=obj;
            for(const k of toks){ if(cur==null) return undefined; cur=cur[k]; }
            return cur;
          }

          (async()=>{
            const res=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
              method:'POST',
              headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'content-type':'application/json'},
              body:JSON.stringify({
                model:'gemini-3.1-flash-lite',
                input:'SEMANTIC_INPUT_JSON:\n'+JSON.stringify(bi.semantic_input),
                system_instruction:groqModelInstructions(bi.availability,bi.verified_evidence),
                response_format:{type:'text',mime_type:'application/json',schema:compactSchema(bi)},
                generation_config:{max_output_tokens:8192,seed:0},
                store:false
              }),
              signal:AbortSignal.timeout(90000)
            });
            let json={}; try{json=await res.json()}catch{}
            if(!res.ok){
              console.log('G31_ROOT '+JSON.stringify({status:res.status,error:json?.error?.message||null}));
              process.exit(2);
            }
            const parsed=JSON.parse(textFrom(json));
            const {evidenceMap,availability}=validateBindingInput(bi);
            const canonical=canonicalizeModelPayload(parsed,evidenceMap,availability);
            try{
              makeValidatedEnvelope(canonical,evidenceMap,availability);
              console.log('G31_ROOT '+JSON.stringify({status:200,validation:'PASS'}));
            }catch(error){
              const offending=getPath(canonical,error?.path);
              console.log('G31_ROOT '+JSON.stringify({
                status:200,
                validation:'FAIL',
                code:error?.code||null,
                path:error?.path||null,
                offending_value:typeof offending==='string'?offending.slice(0,600):offending
              }));
            }
          })().catch(e=>{console.error('G31_ROOT_ERROR '+String(e?.message||e));process.exit(1)});
          NODE
