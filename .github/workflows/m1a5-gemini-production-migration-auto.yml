name: M1A-5 Gemini Production Migration Auto

on:
  push:
    branches:
      - m1a5-root-repair-runtime-4608
    paths:
      - '.github/workflows/m1a5-gemini-production-migration-auto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCEPTED_RUNTIME_SHA: 1689026e137266c0ecc72ac7bf51d68f20497fb2
      FROZEN_SHA: fb1f0498cd0a7c49580cfde574a407e00e2bc20b
      EXPECTED_SOURCE_FINGERPRINT: a93fc65b38808c6e27167bc5a44663bb7aa1e89e60885b6aca4dea854182d04d
      BASE_URL: https://grandmastrolog-delivery-runtime.vercel.app
      VERCEL_ORG_ID: team_x74ux30dPQwWNHy4a8wCkiMx
      VERCEL_PROJECT_ID: prj_XhDus3tQsyiLxrPccbQteXLwbB2a
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GM_API_SECRET: ${{ secrets.GM_API_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout exact migration controller
        uses: actions/checkout@v4
        with:
          ref: m1a5-root-repair-runtime-4608
          fetch-depth: 0

      - name: Freeze accepted runtime and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "BLOCKED:VERCEL_TOKEN_MISSING"; exit 2; }
          test -n "${GM_API_SECRET:-}" || { echo "BLOCKED:GM_API_SECRET_MISSING"; exit 2; }
          test -n "${GEMINI_API_KEY:-}" || { echo "BLOCKED:GEMINI_API_KEY_MISSING"; exit 2; }
          git cat-file -e "$ACCEPTED_RUNTIME_SHA^{commit}"
          git diff --exit-code "$ACCEPTED_RUNTIME_SHA" HEAD --             delivery_runtime gm_integration integration-server.js openapi.yaml Dockerfile package.json package-lock.json
          git fetch --no-tags --depth=1 origin "$FROZEN_SHA"
          for f in             m1a5_acceptance/corpus.normal-natal.v1.json             m1a5_acceptance/rubric.semantic-quality.v1.json             m1a5_acceptance/frozen-manifest.json             m1a5_acceptance/oracle-core.mjs
          do
            test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "FETCH_HEAD:$f")" || {
              echo "FAIL:FROZEN_ARTIFACT_DRIFT:$f"
              exit 1
            }
          done
          echo "MIGRATION_BOUNDARY=PASS"

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Reconfirm accepted runtime regression
        shell: bash
        run: |
          set -euo pipefail
          node --test delivery_runtime/tests/*.test.js | tee /tmp/runtime.tap
          test "$(awk '/^# tests /{print $3}' /tmp/runtime.tap | tail -1)" = "116"
          test "$(awk '/^# pass /{print $3}' /tmp/runtime.tap | tail -1)" = "116"
          test "$(awk '/^# fail /{print $3}' /tmp/runtime.tap | tail -1)" = "0"
          node --test integration_tests/natal-evidence.test.mjs integration_tests/e2e-runtime.test.mjs | tee /tmp/integration.tap
          test "$(awk '/^# tests /{print $3}' /tmp/integration.tap | tail -1)" = "10"
          test "$(awk '/^# pass /{print $3}' /tmp/integration.tap | tail -1)" = "10"
          test "$(awk '/^# fail /{print $3}' /tmp/integration.tap | tail -1)" = "0"

      - name: Install Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel --version

      - name: Link exact Vercel production project
        working-directory: delivery_runtime
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          python3 - <<'PY'
          import json
          x=json.load(open('.vercel/project.json'))
          assert x['projectId']=='prj_XhDus3tQsyiLxrPccbQteXLwbB2a',x
          assert x['orgId']=='team_x74ux30dPQwWNHy4a8wCkiMx',x
          print('VERCEL_PROJECT_BINDING=PASS')
          PY

      - name: Upsert production runtime secrets and model freeze
        working-directory: delivery_runtime
        shell: bash
        run: |
          set -euo pipefail
          upsert_sensitive() {
            local key="$1" value="$2"
            vercel env rm "$key" production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$key" production --sensitive --token="$VERCEL_TOKEN" >/dev/null
          }
          upsert_plain() {
            local key="$1" value="$2"
            vercel env rm "$key" production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$key" production --token="$VERCEL_TOKEN" >/dev/null
          }
          upsert_sensitive GM_API_SECRET "$GM_API_SECRET"
          upsert_sensitive GEMINI_API_KEY "$GEMINI_API_KEY"
          upsert_plain GM_MODEL_PROVIDER "google"
          upsert_plain GM_MODEL "gemini-3.1-flash-lite"
          upsert_plain GM_FINAL_DELIVERY_AUTHORIZED "true"
          echo "VERCEL_PRODUCTION_ENV_SYNC=PASS"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null

      - name: Build exact accepted runtime
        working-directory: delivery_runtime
        shell: bash
        run: |
          set -euo pipefail
          vercel build --prod --token="$VERCEL_TOKEN"
          test -d .vercel/output
          echo "VERCEL_BUILD=PASS"

      - name: Deploy exact runtime to production
        id: deploy
        working-directory: delivery_runtime
        shell: bash
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -1 | tr -d '\r')"
          test -n "$URL"
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "VERCEL_DEPLOY_URL=$URL"

      - name: Wait for production alias and verify physical provenance
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "$BASE_URL/api/health" -o /tmp/health.json; then
              if python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/health.json',encoding='utf-8'))
          p=x.get('source_provenance') or {}
          d=x.get('deployment_provenance') or {}
          ok=(
            p.get('fingerprint')==os.environ['EXPECTED_SOURCE_FINGERPRINT'] and
            d.get('project_id')==os.environ['VERCEL_PROJECT_ID'] and
            d.get('environment')=='production'
          )
          raise SystemExit(0 if ok else 1)
          PY
              then break; fi
            fi
            test "$i" != "36"
            sleep 5
          done
          python3 - <<'PY'
          import json,os,re
          x=json.load(open('/tmp/health.json',encoding='utf-8'))
          p=x['source_provenance']; d=x['deployment_provenance']
          assert p['fingerprint']==os.environ['EXPECTED_SOURCE_FINGERPRINT']
          assert p['algorithm']=='git-blob-sha1-manifest-v1'
          for required in [
            'delivery_runtime/lib/provider-adapter.js',
            'delivery_runtime/lib/semantic-generation.js',
            'delivery_runtime/lib/semantic-normalizer.js'
          ]:
            assert required in p['files'],required
          assert d['project_id']==os.environ['VERCEL_PROJECT_ID']
          assert d['environment']=='production'
          assert re.fullmatch(r'dpl_[A-Za-z0-9]+',d['deployment_id'])
          json.dump({
            'deployment_id':d['deployment_id'],
            'project_id':d['project_id'],
            'source_fingerprint':p['fingerprint']
          },open('/tmp/deployment.json','w'),sort_keys=True)
          print('PRODUCTION_PROVENANCE=PASS deployment_id='+d['deployment_id'])
          PY

      - name: Run live production frozen M1A-5 acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m1a5-production
          node <<'NODE'
          const fs=require('node:fs');
          const {buildNatalBindingInput}=require('./gm_integration/natal-evidence.js');
          const {signTrustedRequest}=require('./delivery_runtime/lib/trust-boundary.js');

          const corpus=JSON.parse(fs.readFileSync('m1a5_acceptance/corpus.normal-natal.v1.json','utf8'));
          const base=process.env.BASE_URL;
          const secret=process.env.GM_API_SECRET;

          (async()=>{
            const {evaluate,anchorScore,producer,aggregate}=await import('./m1a5_acceptance/oracle-core.mjs');
            const frozenRubric=JSON.parse(fs.readFileSync('m1a5_acceptance/rubric.semantic-quality.v1.json','utf8'));
            const delta=JSON.parse(fs.readFileSync('m1a5_successor/calibration-delta.v1.json','utf8'));
            const rubric=JSON.parse(JSON.stringify(frozenRubric));
            const old=delta.superseded_markers;
            const markers=rubric.canonical_language.required_markers_exact_once_in_order;
            if(delta.mutation_scope!=='canonical_language.required_markers_exact_once_in_order') throw new Error('DELTA_SCOPE_INVALID');
            if(delta.semantic_thresholds_unchanged!==true) throw new Error('DELTA_THRESHOLDS_UNLOCKED');
            if(!old.every(x=>markers.filter(y=>y===x).length===1)) throw new Error('DELTA_MARKER_IDENTITY');
            const at=Math.min(...old.map(x=>markers.indexOf(x)));
            const next=markers.filter(x=>!old.includes(x));
            next.splice(at,0,delta.authorized_marker);
            rubric.canonical_language.required_markers_exact_once_in_order=next;

            const cases=[];
            let last=0;
            for(const t of corpus.cases){
              const gap=Math.max(0,15000-(Date.now()-last));
              if(gap) await new Promise(r=>setTimeout(r,gap));
              last=Date.now();

              const bi=buildNatalBindingInput({request_id:t.request_id,birth:t.birth}).binding_input;
              const body={binding_input:bi};
              const seal=signTrustedRequest({secret,routeId:'e2e-natal',body});
              let res;
              try{
                res=await fetch(base+'/api/e2e-natal',{
                  method:'POST',
                  headers:{
                    'content-type':'application/json',
                    authorization:'Bearer '+secret,
                    'x-gm-evidence-source':seal.source,
                    'x-gm-evidence-timestamp':String(seal.timestamp),
                    'x-gm-evidence-signature':seal.signature
                  },
                  body:JSON.stringify(body),
                  signal:AbortSignal.timeout(120000)
                });
              }catch(error){
                cases.push({case_id:t.case_id,verdict:'BLOCKED',reason:'PRODUCTION_REQUEST_ERROR'});
                continue;
              }
              let json={}; try{json=await res.json()}catch{}
              if(!res.ok){
                const verdict=(res.status===429||res.status>=500)?'BLOCKED':'FAIL';
                const item={case_id:t.case_id,verdict,reason:json?.code||('HTTP_'+res.status),status:res.status,upstream_status:json?.upstream_status??null};
                cases.push(item);
                console.log('PRODUCTION_CASE '+JSON.stringify(item));
                continue;
              }
              if(json?.provider!=='google'||json?.model!=='gemini-3.1-flash-lite'){
                const item={case_id:t.case_id,verdict:'FAIL',reason:'PROVIDER_MODEL_MISMATCH',provider:json?.provider,model:json?.model};
                cases.push(item);
                console.log('PRODUCTION_CASE '+JSON.stringify(item));
                continue;
              }
              const markdown=json?.delivery?.canonical_markdown;
              if(typeof markdown!=='string'||!markdown){
                const item={case_id:t.case_id,verdict:'FAIL',reason:'FINAL_DELIVERY_MISSING'};
                cases.push(item);
                console.log('PRODUCTION_CASE '+JSON.stringify(item));
                continue;
              }
              const e=evaluate(markdown,bi.verified_evidence,rubric);
              const verdict=aggregate(Object.values(e.dimensions).map(x=>x.verdict));
              const item={
                case_id:t.case_id,verdict,
                dimensions:e.dimensions,
                producer_failures:e.producer_failures,
                provider:json.provider,model:json.model,
                _body:e.combinedBody,_ev:bi.verified_evidence
              };
              cases.push(item);
              console.log('PRODUCTION_CASE '+JSON.stringify({
                case_id:t.case_id,verdict,provider:json.provider,model:json.model,
                dimensions:Object.fromEntries(Object.entries(e.dimensions).map(([k,v])=>[k,v.verdict]))
              }));
            }

            const complete=cases.filter(x=>x._body&&x._ev);
            const counterexample=[];
            if(complete.length!==corpus.cases.length){
              counterexample.push({verdict:'UNKNOWN',reason:'COUNTEREXAMPLE_REQUIRES_ALL_CORPUS_OUTPUTS'});
            }else{
              for(const own of complete){
                const ownScore=anchorScore(own._body,own._ev,rubric.specificity.anchor_subjects).score;
                let bestOther=0;
                const comparisons=[];
                for(const other of complete){
                  if(other.case_id===own.case_id) continue;
                  const score=anchorScore(own._body,other._ev,rubric.specificity.anchor_subjects).score;
                  bestOther=Math.max(bestOther,score);
                  comparisons.push({against_case_id:other.case_id,score});
                }
                const margin=ownScore-bestOther;
                const pass=ownScore>=rubric.counterexample_specificity.minimum_own_anchor_score &&
                  margin>=rubric.counterexample_specificity.minimum_margin_over_best_other_case;
                counterexample.push({
                  case_id:own.case_id,verdict:pass?'PASS':'FAIL',
                  own_anchor_score:ownScore,best_other_case_score:bestOther,margin,comparisons,
                  producer:pass?null:producer('counterexample_specificity')
                });
              }
            }
            for(const x of cases){delete x._body;delete x._ev}
            const overall=aggregate([...cases.map(x=>x.verdict),...counterexample.map(x=>x.verdict)]);
            const result={
              overall,
              acceptance_id:'M1A-5_GEMINI_3_1_PRODUCTION_FINAL',
              runtime_source_commit:process.env.ACCEPTED_RUNTIME_SHA,
              provider:'google',
              model:'gemini-3.1-flash-lite',
              source_fingerprint:process.env.EXPECTED_SOURCE_FINGERPRINT,
              cases,
              counterexample_specificity:counterexample
            };
            fs.writeFileSync('/tmp/m1a5-production/results.json',JSON.stringify(result,null,2)+'\n');
            console.log('PRODUCTION_M1A5_OVERALL='+overall);
            for(const z of counterexample) console.log('PRODUCTION_COUNTEREXAMPLE '+JSON.stringify(z));
            if(overall!=='PASS') process.exit(1);
          })().catch(e=>{console.error('PRODUCTION_ACCEPTANCE_ERROR '+String(e?.message||e));process.exit(1)});
          NODE

      - name: Emit production acceptance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-migration-evidence
          cp /tmp/health.json production-migration-evidence/health.json 2>/dev/null || true
          cp /tmp/deployment.json production-migration-evidence/deployment.json 2>/dev/null || true
          cp /tmp/m1a5-production/results.json production-migration-evidence/results.json 2>/dev/null || true
          if [ -f /tmp/m1a5-production/results.json ]; then
            python3 - <<'PY'
          import json
          x=json.load(open('/tmp/m1a5-production/results.json'))
          print('M1A5_GEMINI_PRODUCTION_FINAL='+str(x.get('overall')))
          for c in x.get('cases',[]): print('CASE',c.get('case_id'),c.get('verdict'),c.get('reason',''))
          for z in x.get('counterexample_specificity',[]): print('COUNTEREXAMPLE',json.dumps(z,ensure_ascii=False,sort_keys=True))
          if x.get('overall')!='PASS': raise SystemExit(1)
          PY
          else
            echo "M1A5_GEMINI_PRODUCTION_FINAL=BLOCKED"
            exit 2
          fi

      - name: Upload immutable production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1a5-gemini-production-${{ github.run_id }}
          path: production-migration-evidence/
          if-no-files-found: warn
          retention-days: 30
