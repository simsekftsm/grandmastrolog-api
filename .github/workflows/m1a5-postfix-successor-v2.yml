name: M1A-5 Post-Fix Successor Acceptance V2

on:
  push:
    branches:
      - m1a5-root-repair-runtime-4608
    paths:
      - 'm1a5_acceptance/**'
      - 'm1a5_successor/**'
      - '.github/m1a4-final-production-lock.json'
      - '.github/real-e2e-production-lock.json'
      - '.github/workflows/m1a5-postfix-successor-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME_SHA: b5ee123cecdbe220a8db7957a64f881738c07b24
      FROZEN_SHA: fb1f0498cd0a7c49580cfde574a407e00e2bc20b
      PRODUCTION_URL: https://grandmastrolog-api-production.up.railway.app
      VERCEL_URL: https://grandmastrolog-delivery-runtime.vercel.app
      GM_API_SECRET: ${{ secrets.GM_API_SECRET }}

    steps:
      - name: Checkout exact successor head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Enforce runtime freeze and frozen oracle identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git cat-file -e "$RUNTIME_SHA^{commit}"
          git diff --exit-code "$RUNTIME_SHA" HEAD --             delivery_runtime gm_integration integration-server.js openapi.yaml Dockerfile package.json package-lock.json
          git fetch --no-tags --depth=1 origin "$FROZEN_SHA"
          for f in             m1a5_acceptance/corpus.normal-natal.v1.json             m1a5_acceptance/rubric.semantic-quality.v1.json             m1a5_acceptance/frozen-manifest.json             m1a5_acceptance/oracle-core.mjs             m1a5_acceptance/oracle-runner.mjs
          do
            test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "FETCH_HEAD:$f")" || {
              echo "FAIL:FROZEN_ARTIFACT_DRIFT:$f"
              exit 1
            }
          done
          python3 - <<'PY'
          import hashlib,json
          manifest=json.load(open('m1a5_acceptance/frozen-manifest.json',encoding='utf-8'))
          for path,key in [
            ('m1a5_acceptance/corpus.normal-natal.v1.json','corpus_sha256'),
            ('m1a5_acceptance/rubric.semantic-quality.v1.json','rubric_sha256')
          ]:
            actual=hashlib.sha256(open(path,'rb').read()).hexdigest()
            print(path,actual)
            assert actual==manifest[key]
          PY

      - name: Verify calibration successor delta is the only rubric change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json
          r=json.load(open('m1a5_acceptance/rubric.semantic-quality.v1.json',encoding='utf-8'))
          d=json.load(open('m1a5_successor/calibration-delta.v1.json',encoding='utf-8'))
          assert d['base_rubric_id']==r['rubric_id']
          assert d['mutation_scope']=='canonical_language.required_markers_exact_once_in_order'
          assert d['semantic_thresholds_unchanged'] is True
          old=d['superseded_markers']
          assert old==[
            'Buraya kadarki ana yaşam alanları sende karşılık buluyor mu? **Evet / Hayır / Kısmen**',
            'Bu anlattıklarım sende karşılık buluyor mu? **Evet / Hayır / Kısmen**'
          ]
          new='Bu anlattıklarım sende karşılık buldu mu: *Evet / Hayır / Kısmen*'
          assert d['authorized_marker']==new
          markers=r['canonical_language']['required_markers_exact_once_in_order']
          assert all(markers.count(x)==1 for x in old)
          successor=[x for x in markers if x not in old]
          successor.insert(min(markers.index(x) for x in old),new)
          r2=copy.deepcopy(r)
          r2['canonical_language']['required_markers_exact_once_in_order']=successor
          normalized=copy.deepcopy(r2)
          normalized['canonical_language']['required_markers_exact_once_in_order']=markers
          assert normalized==r
          print('CALIBRATION_DELTA_ONLY=PASS')
          PY

      - name: Verify current production provenance
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GM_API_SECRET:-}" || { echo 'BLOCKED:GM_API_SECRET_MISSING'; exit 2; }
          curl -fsS "$VERCEL_URL/api/health" -o /tmp/v.json
          curl -fsS "$PRODUCTION_URL/integration/health" -o /tmp/r.json
          curl -fsS "$PRODUCTION_URL/health" -o /tmp/l.json
          python3 - <<'PY'
          import json,os
          lock=json.load(open('.github/real-e2e-production-lock.json',encoding='utf-8'))
          v=json.load(open('/tmp/v.json',encoding='utf-8'))
          r=json.load(open('/tmp/r.json',encoding='utf-8'))
          l=json.load(open('/tmp/l.json',encoding='utf-8'))
          expected=os.environ['RUNTIME_SHA']
          assert lock['runtime_source_commit']==expected
          assert v['ok'] is True and v['stage']=='M1A-4'
          assert v['delivery_validator_enabled'] is True
          assert v['final_delivery_authorized'] is True
          assert v['raw_delivery_allowed'] is False
          assert v['runtime_transport']['runtime_source_commit']==expected
          assert v['deployment_provenance']['deployment_id']==lock['vercel_deployment_id']
          assert v['deployment_provenance']['project_id']==lock['vercel_project_id']
          assert v['source_provenance']['fingerprint']==lock['m1a4_source_fingerprint']
          assert r['ok'] is True and r['legacy_ready'] is True
          assert r['evidence_engine']=='grandmastrolog_swisseph_natal_v1'
          assert r['railway_commit']==expected
          assert r['railway_deployment_id']==lock['railway_deployment_id']
          assert l['ok'] is True and l['service']=='grandmastrolog-api' and l['swisseph']['ok'] is True
          print('PRODUCTION_PROVENANCE=PASS')
          PY

      - name: Install evidence-engine dependencies
        run: npm install --no-audit --no-fund

      - name: Run successor oracle through real production
        env:
          M1A5_PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
        run: node m1a5_successor/oracle-runner.mjs

      - name: Upload successor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1a5-postfix-successor-v2-${{ github.sha }}
          path: m1a5_successor/run-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f m1a5_successor/run-artifacts/m1a5-successor-results.json || {
            echo 'BLOCKED:M1A5_SUCCESSOR_RESULT_MISSING'
            exit 2
          }
          python3 - <<'PY'
          import json
          x=json.load(open('m1a5_successor/run-artifacts/m1a5-successor-results.json',encoding='utf-8'))
          print('M1A5_POSTFIX_SUCCESSOR_V2='+str(x.get('overall')))
          for c in x.get('cases',[]):
              print('CASE',c.get('case_id'),c.get('verdict'))
              if c.get('reason'): print('REASON',c.get('case_id'),c.get('reason'))
              if c.get('dimensions'):
                  print('DIMENSIONS',c.get('case_id'),json.dumps(c.get('dimensions'),ensure_ascii=False,sort_keys=True))
              for p in c.get('producer_failures',[]):
                  print('PRODUCER_FAILURE',json.dumps(p,ensure_ascii=False,sort_keys=True))
          for z in x.get('counterexample_specificity',[]):
              print('COUNTEREXAMPLE',json.dumps(z,ensure_ascii=False,sort_keys=True))
          v=x.get('overall')
          if v=='PASS': raise SystemExit(0)
          if v=='FAIL': raise SystemExit(1)
          if v=='BLOCKED': raise SystemExit(2)
          raise SystemExit(3)
          PY
