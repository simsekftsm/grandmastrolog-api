name: M1A-4 Trust Boundary Live Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://grandmastrolog-delivery-runtime.vercel.app
      EXISTING_API_URL: https://grandmastrolog-api-production.up.railway.app
      EXPECTED_VERCEL_PROJECT_ID: prj_XhDus3tQsyiLxrPccbQteXLwbB2a
      EXPECTED_MAIN_HEAD: c71f752c9d7c426c056e8e912c767465c6599d91
      GM_API_SECRET: ${{ secrets.GM_API_SECRET }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify candidate, PR boundary, main freeze and M1A-4 production lock authority
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.draft }}' = 'true'
            test '${{ github.event.pull_request.base.ref }}' = 'main'
            test '${{ github.event.pull_request.head.ref }}' = 'm1a-1-delivery-runtime-foundation'
          fi
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN_HEAD"
          test -f .github/m1a4-trust-production-lock.json
          python3 - <<'PY'
          import json
          x=json.load(open('.github/m1a4-trust-production-lock.json',encoding='utf-8'))
          required={'deployment_id','project_id','runtime_source_commit','source_fingerprint','source_provenance_blob_sha'}
          assert set(x)==required
          assert x['deployment_id'].startswith('dpl_')
          assert x['project_id']=='prj_XhDus3tQsyiLxrPccbQteXLwbB2a'
          assert len(x['runtime_source_commit'])==40
          assert len(x['source_fingerprint'])==64
          assert len(x['source_provenance_blob_sha'])==40
          PY
          RUNTIME_SOURCE="$(python3 -c "import json; print(json.load(open('.github/m1a4-trust-production-lock.json'))['runtime_source_commit'])")"
          git fetch --no-tags --depth=1 origin "$RUNTIME_SOURCE"
          mapfile -t CHANGED < <(git diff --name-only "$RUNTIME_SOURCE" HEAD)
          test "${#CHANGED[@]}" = '1'
          test "${CHANGED[0]}" = '.github/m1a4-trust-production-lock.json'

      - name: Local M1A-2, M1A-3 and trust-boundary regression 88 of 88
        working-directory: delivery_runtime
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/*.test.js | tee /tmp/m1a4-tests.tap
          TESTS="$(awk '/^# tests /{print $3}' /tmp/m1a4-tests.tap | tail -1)"
          PASS="$(awk '/^# pass /{print $3}' /tmp/m1a4-tests.tap | tail -1)"
          FAIL="$(awk '/^# fail /{print $3}' /tmp/m1a4-tests.tap | tail -1)"
          test "$TESTS" = '88'
          test "$PASS" = '88'
          test "$FAIL" = '0'

      - name: Production health, immutable deployment and exact source provenance gate
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "$BASE_URL/api/health" -o /tmp/health.json; then
              if python3 - <<'PY'
          import json
          x=json.load(open('/tmp/health.json',encoding='utf-8'))
          raise SystemExit(0 if x.get('stage')=='M1A-4-TRUST-BOUNDARY' else 1)
          PY
              then break; fi
            fi
            test "$i" != '36'
            sleep 5
          done
          python3 - <<'PY'
          import hashlib,json,subprocess
          x=json.load(open('/tmp/health.json',encoding='utf-8'))
          lock=json.load(open('.github/m1a4-trust-production-lock.json',encoding='utf-8'))
          expected={
            'ok':True,
            'service':'grandmastrolog-delivery-runtime',
            'stage':'M1A-4-TRUST-BOUNDARY',
            'mode':'fail-closed',
            'delivery_boundary':'present',
            'raw_delivery_allowed':False,
            'structured_contract_enabled':True,
            'canonical_renderer_enabled':True,
            'trust_boundary_enabled':True,
            'privileged_surface_authentication':'gm_api_secret_hmac_v1',
            'trusted_evidence_provenance_required':True,
            'delivery_validator_enabled':False,
            'final_delivery_authorized':False,
            'next_stage':'M1A-4'
          }
          for k,v in expected.items(): assert x.get(k)==v,(k,x.get(k),v)
          files=[
            'delivery_runtime/api/delivery.js',
            'delivery_runtime/api/health.js',
            'delivery_runtime/api/model-natal.js',
            'delivery_runtime/api/render-natal.js',
            'delivery_runtime/api/validate-natal.js',
            'delivery_runtime/contracts/gm-natal-semantic-v1.schema.json',
            'delivery_runtime/lib/element-visual.js',
            'delivery_runtime/lib/foundation.js',
            'delivery_runtime/lib/groq-binding.js',
            'delivery_runtime/lib/model-binding.js',
            'delivery_runtime/lib/natal-contract.js',
            'delivery_runtime/lib/natal-renderer.js',
            'delivery_runtime/lib/schema-runtime.js',
            'delivery_runtime/lib/trust-boundary.js',
            'delivery_runtime/package.json',
            'delivery_runtime/public/elements/ates.png',
            'delivery_runtime/public/elements/hava.png',
            'delivery_runtime/public/elements/su.png',
            'delivery_runtime/public/elements/toprak.png',
            'delivery_runtime/vercel.json'
          ]
          local={p:subprocess.check_output(['git','hash-object',p],text=True).strip() for p in files}
          canonical=''.join(f'{p}={local[p]}\n' for p in sorted(local))
          fingerprint=hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          provenance=x.get('source_provenance') or {}
          deployment=x.get('deployment_provenance') or {}
          transport=x.get('runtime_transport') or {}
          provenance_blob=subprocess.check_output(['git','hash-object','delivery_runtime/lib/source-provenance.js'],text=True).strip()
          assert fingerprint==lock['source_fingerprint']
          assert provenance_blob==lock['source_provenance_blob_sha']
          assert provenance.get('algorithm')=='git-blob-sha1-manifest-v1'
          assert provenance.get('files')==local
          assert provenance.get('fingerprint')==fingerprint
          assert deployment.get('deployment_id')==lock['deployment_id']
          assert deployment.get('project_id')==lock['project_id']
          assert deployment.get('environment')=='production'
          assert transport.get('runtime_source_commit')==lock['runtime_source_commit']
          PY
          for asset in ates hava su toprak; do
            curl -fsS "$BASE_URL/elements/$asset.png" -o "/tmp/$asset.png"
            test -s "/tmp/$asset.png"
          done

      - name: Build deterministic canonical probe fixtures
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const {availability,bindingInput,validPayload,clone}=require('./delivery_runtime/tests/helpers');
          const baseAv=availability();
          const baseBinding=bindingInput(baseAv);
          const basePayload=validPayload(baseAv);
          fs.writeFileSync('/tmp/valid.json',JSON.stringify({binding_input:baseBinding,semantic_payload:basePayload}));
          fs.writeFileSync('/tmp/model.json',JSON.stringify(baseBinding));
          const bad=clone(basePayload); bad.pre_seal_sections[0].body_paragraphs=['> *Hat: escape*'];
          fs.writeFileSync('/tmp/bad.json',JSON.stringify({binding_input:baseBinding,semantic_payload:bad}));
          const av=availability({element_dengen:true,sinerji:true,senin_yolun:true,hellenistic:true,sade_sati:true});
          const binding=bindingInput(av);
          binding.verified_evidence.find(x=>x.evidence_id==='ev_element_dengen').semantic_value=JSON.stringify({'Ateş':45,'Toprak':25,'Hava':20,'Su':10});
          const payload=validPayload(av);
          fs.writeFileSync('/tmp/element.json',JSON.stringify({binding_input:binding,semantic_payload:payload}));
          NODE

      - name: Trust boundary live negative and valid-path gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GM_API_SECRET:-}"

          seal() {
            local route="$1"
            local file="$2"
            local timestamp="${3:-}"
            node - "$route" "$file" "$timestamp" <<'NODE'
          const fs=require('node:fs');
          const {signTrustedRequest}=require('./delivery_runtime/lib/trust-boundary');
          const route=process.argv[2];
          const file=process.argv[3];
          const supplied=process.argv[4];
          const body=JSON.parse(fs.readFileSync(file,'utf8'));
          const timestamp=supplied ? Number(supplied) : undefined;
          const seal=signTrustedRequest({
            secret:process.env.GM_API_SECRET,
            routeId:route,
            timestamp,
            body
          });
          process.stdout.write(`${seal.timestamp} ${seal.signature}`);
          NODE
          }

          STATUS=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' -X POST "$BASE_URL/api/model-natal" -H 'content-type: application/json' --data-binary @/tmp/model.json)
          test "$STATUS" = '401'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/unauth.json'))
          assert x=={'ok':False,'code':'UNAUTHORIZED'}
          PY

          STATUS=$(curl -sS -o /tmp/unauthorized.json -w '%{http_code}' -X POST "$BASE_URL/api/model-natal" -H 'content-type: application/json' -H 'authorization: Bearer definitely-wrong' --data-binary @/tmp/model.json)
          test "$STATUS" = '401'

          STATUS=$(curl -sS -o /tmp/self-asserted.json -w '%{http_code}' -X POST "$BASE_URL/api/validate-natal" -H 'content-type: application/json' -H "authorization: Bearer $GM_API_SECRET" --data-binary @/tmp/valid.json)
          test "$STATUS" = '403'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/self-asserted.json'))
          assert x['code']=='TRUST_PROVENANCE_REQUIRED'
          PY

          NOW="$(date +%s)"
          STATUS=$(curl -sS -o /tmp/forged.json -w '%{http_code}' -X POST "$BASE_URL/api/validate-natal" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $GM_API_SECRET" \
            -H 'x-gm-evidence-source: grandmastrolog-api' \
            -H "x-gm-evidence-timestamp: $NOW" \
            -H "x-gm-evidence-signature: $(printf '0%.0s' {1..64})" \
            --data-binary @/tmp/valid.json)
          test "$STATUS" = '403'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/forged.json'))
          assert x['code']=='TRUST_PROVENANCE_INVALID'
          PY

          STALE="$((NOW-301))"
          read -r STALE_TS STALE_SIG <<< "$(seal validate-natal /tmp/valid.json "$STALE")"
          STATUS=$(curl -sS -o /tmp/stale.json -w '%{http_code}' -X POST "$BASE_URL/api/validate-natal" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $GM_API_SECRET" \
            -H 'x-gm-evidence-source: grandmastrolog-api' \
            -H "x-gm-evidence-timestamp: $STALE_TS" \
            -H "x-gm-evidence-signature: $STALE_SIG" \
            --data-binary @/tmp/valid.json)
          test "$STATUS" = '403'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/stale.json'))
          assert x['code']=='TRUST_PROVENANCE_STALE'
          PY

          read -r TS SIG <<< "$(seal validate-natal /tmp/valid.json)"
          STATUS=$(curl -sS -o /tmp/trusted-valid.json -w '%{http_code}' -X POST "$BASE_URL/api/validate-natal" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $GM_API_SECRET" \
            -H 'x-gm-evidence-source: grandmastrolog-api' \
            -H "x-gm-evidence-timestamp: $TS" \
            -H "x-gm-evidence-signature: $SIG" \
            --data-binary @/tmp/valid.json)
          test "$STATUS" = '200'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/trusted-valid.json'))
          assert x['ok'] is True
          assert x['contract']['contract_version']=='gm.natal.v1'
          PY

      - name: M1A-2 strict semantic contract live regression
        shell: bash
        run: |
          set -euo pipefail
          seal() {
            local route="$1"; local file="$2"
            node - "$route" "$file" <<'NODE'
          const fs=require('node:fs');
          const {signTrustedRequest}=require('./delivery_runtime/lib/trust-boundary');
          const body=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const s=signTrustedRequest({secret:process.env.GM_API_SECRET,routeId:process.argv[2],body});
          process.stdout.write(`${s.timestamp} ${s.signature}`);
          NODE
          }
          read -r TS SIG <<< "$(seal validate-natal /tmp/bad.json)"
          STATUS=$(curl -sS -o /tmp/bad-out.json -w '%{http_code}' -X POST "$BASE_URL/api/validate-natal" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $GM_API_SECRET" \
            -H 'x-gm-evidence-source: grandmastrolog-api' \
            -H "x-gm-evidence-timestamp: $TS" \
            -H "x-gm-evidence-signature: $SIG" \
            --data-binary @/tmp/bad.json)
          test "$STATUS" = '422'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/bad-out.json'))
          assert x['code']=='MARKDOWN_ESCAPE'
          PY

      - name: M1A-3 canonical renderer live determinism and semantic-preservation regression
        shell: bash
        run: |
          set -euo pipefail
          seal() {
            local file="$1"
            node - "$file" <<'NODE'
          const fs=require('node:fs');
          const {signTrustedRequest}=require('./delivery_runtime/lib/trust-boundary');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const s=signTrustedRequest({secret:process.env.GM_API_SECRET,routeId:'render-natal',body});
          process.stdout.write(`${s.timestamp} ${s.signature}`);
          NODE
          }
          for n in 1 2; do
            read -r TS SIG <<< "$(seal /tmp/valid.json)"
            STATUS=$(curl -sS -o "/tmp/render$n.json" -w '%{http_code}' -X POST "$BASE_URL/api/render-natal" \
              -H 'content-type: application/json' \
              -H "authorization: Bearer $GM_API_SECRET" \
              -H 'x-gm-evidence-source: grandmastrolog-api' \
              -H "x-gm-evidence-timestamp: $TS" \
              -H "x-gm-evidence-signature: $SIG" \
              --data-binary @/tmp/valid.json)
            test "$STATUS" = '200'
          done
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/render1.json')); b=json.load(open('/tmp/render2.json'))
          assert a==b
          r=a['render']; m=r['canonical_markdown']
          assert r['render_state']=='rendered_for_m1a3_acceptance'
          assert r['final_delivery_authorized'] is False
          assert r['delivery_validator_enabled'] is False
          assert m.startswith('---\n> # • NATAL (DOĞUM) HARİTAN •\n')
          for h in ['> ## • PROFİLİN •','> ## • HARİTANIN ÖZÜ •','> ## • PARA & KARİYER •','> ## • İLİŞKİLER •','> ## • AİLE •','> ## • KARMALAR •']:
              assert m.count(h)==1,h
          assert '"semantic_payload"' not in m and 'raw_model_output' not in m
          assert r['canonical_markdown_sha256']==b['render']['canonical_markdown_sha256']
          PY

      - name: Real Groq strict structured-output plus trusted renderer regression
        shell: bash
        run: |
          set -euo pipefail
          seal() {
            local route="$1"; local file="$2"
            node - "$route" "$file" <<'NODE'
          const fs=require('node:fs');
          const {signTrustedRequest}=require('./delivery_runtime/lib/trust-boundary');
          const body=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const s=signTrustedRequest({secret:process.env.GM_API_SECRET,routeId:process.argv[2],body});
          process.stdout.write(`${s.timestamp} ${s.signature}`);
          NODE
          }
          read -r TS SIG <<< "$(seal model-natal /tmp/model.json)"
          STATUS=$(curl -sS -o /tmp/model-out.json -w '%{http_code}' -X POST "$BASE_URL/api/model-natal" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $GM_API_SECRET" \
            -H 'x-gm-evidence-source: grandmastrolog-api' \
            -H "x-gm-evidence-timestamp: $TS" \
            -H "x-gm-evidence-signature: $SIG" \
            --data-binary @/tmp/model.json)
          if [ "$STATUS" != '200' ]; then
            python3 - <<'PY'
          import json
          x=json.load(open('/tmp/model-out.json'))
          safe={k:x.get(k) for k in ('code','upstream_provider','upstream_status','path','expected_model') if k in x}
          print('MODEL_BINDING_DIAGNOSTIC='+json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/model-out.json'))
          assert x['ok'] is True
          assert x['provider']=='groq'
          assert x['model']=='openai/gpt-oss-120b'
          assert x['model_binding']=='groq_responses_json_schema_strict'
          assert x['contract']['render_state']=='blocked_until_m1a3'
          raw=json.dumps(x,ensure_ascii=False)
          assert '> ##' not in raw
          assert 'raw_markdown' not in raw
          assert 'rendered_section' not in raw
          binding=json.load(open('/tmp/model.json'))
          json.dump({'binding_input':binding,'semantic_payload':x['contract']['semantic_payload']},open('/tmp/model-render.json','w'),ensure_ascii=False)
          PY

          read -r RTS RSIG <<< "$(seal render-natal /tmp/model-render.json)"
          STATUS=$(curl -sS -o /tmp/model-render-out.json -w '%{http_code}' -X POST "$BASE_URL/api/render-natal" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $GM_API_SECRET" \
            -H 'x-gm-evidence-source: grandmastrolog-api' \
            -H "x-gm-evidence-timestamp: $RTS" \
            -H "x-gm-evidence-signature: $RSIG" \
            --data-binary @/tmp/model-render.json)
          test "$STATUS" = '200'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/model-render-out.json'))
          assert x['ok'] is True
          r=x['render']; m=r['canonical_markdown']
          assert r['final_delivery_authorized'] is False
          assert r['delivery_validator_enabled'] is False
          assert '"semantic_payload"' not in m
          assert 'raw_model_output' not in m
          PY

      - name: Final delivery remains fail closed and raw model output cannot echo
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/delivery.json -w '%{http_code}' -X POST "$BASE_URL/api/delivery" -H 'content-type: application/json' --data-binary '{"raw_output":"# • DOĞUM HARİTAN •\n> malformed output"}')
          test "$STATUS" = '503'
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/delivery.json'))
          assert x['ok'] is False
          assert x['code']=='M1A_3_DELIVERY_VALIDATOR_NOT_AVAILABLE'
          assert x['raw_delivery_allowed'] is False
          assert x['canonical_renderer_enabled'] is True
          assert x['delivery_validator_enabled'] is False
          assert x['final_delivery_authorized'] is False
          assert 'malformed output' not in json.dumps(x,ensure_ascii=False)
          PY

      - name: Method boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/a -w '%{http_code}' "$BASE_URL/api/delivery")" = '405'
          test "$(curl -sS -o /tmp/b -w '%{http_code}' "$BASE_URL/api/validate-natal")" = '405'
          test "$(curl -sS -o /tmp/c -w '%{http_code}' "$BASE_URL/api/model-natal")" = '405'
          test "$(curl -sS -o /tmp/d -w '%{http_code}' "$BASE_URL/api/render-natal")" = '405'

      - name: Existing unrelated GrandMastrolog API regression probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$EXISTING_API_URL/health" -o /tmp/existing-health.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/existing-health.json'))
          assert x.get('ok') is True
          assert (x.get('swisseph') or {}).get('ok') is True
          PY
