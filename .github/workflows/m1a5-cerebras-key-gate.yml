name: M1A-5 Cerebras Key Gate

on:
  push:
    branches:
      - m1a5-root-repair-runtime-4608
    paths:
      - '.github/workflows/m1a5-cerebras-key-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - name: Verify Cerebras key availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CEREBRAS_API_KEY:-}" ]; then
            echo "CEREBRAS_KEY_GATE=PASS"
          else
            echo "CEREBRAS_KEY_GATE=BLOCKED"
            exit 2
          fi
