name: M1A-5 Fix Local Regression

on:
  push:
    branches:
      - m1a5-upstream-diagnostic-20260918
    paths:
      - '.github/workflows/m1a5-fix-local-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 3363af042ff70f7ed3d2caab8b094d69b1eaf1e7
    steps:
      - name: Checkout exact fix candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify narrow delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --name-only 49d56e4585f0ab1a6b6fc550e3f2fe1651964371 HEAD | sort > /tmp/changed
          printf '%s\n'             delivery_runtime/api/e2e-natal.js             delivery_runtime/api/model-natal.js             delivery_runtime/tests/api.test.js \
            delivery_runtime/lib/source-provenance.js | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          grep -q "max_output_tokens: MAX_GROQ_OUTPUT_TOKENS" delivery_runtime/api/model-natal.js
          grep -q "max_output_tokens: MAX_GROQ_OUTPUT_TOKENS" delivery_runtime/api/e2e-natal.js
          test "$(grep -c "MAX_GROQ_OUTPUT_TOKENS = 3072" delivery_runtime/api/model-natal.js)" = "1"
          test "$(grep -c "MAX_GROQ_OUTPUT_TOKENS = 3072" delivery_runtime/api/e2e-natal.js)" = "1"
          grep -q "4f481d93a14b55329f06d0ecb834ee4010851ab9d10b748341d13fcb0ea62662" delivery_runtime/lib/source-provenance.js
      - name: Run exact local regression
        working-directory: delivery_runtime
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/*.test.js | tee /tmp/tests.tap
          TESTS="$(awk '/^# tests /{print $3}' /tmp/tests.tap | tail -1)"
          PASS="$(awk '/^# pass /{print $3}' /tmp/tests.tap | tail -1)"
          FAIL="$(awk '/^# fail /{print $3}' /tmp/tests.tap | tail -1)"
          echo "REGRESSION tests=$TESTS pass=$PASS fail=$FAIL"
          test "$TESTS" = "108"
          test "$PASS" = "108"
          test "$FAIL" = "0"

      - name: Run integration regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --test integration_tests/natal-evidence.test.mjs integration_tests/e2e-runtime.test.mjs
