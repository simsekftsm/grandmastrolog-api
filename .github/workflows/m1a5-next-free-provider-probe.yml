name: M1A-5 Next Free Provider Probe

on:
  push:
    branches:
      - m1a5-root-repair-runtime-4608
    paths:
      - '.github/workflows/m1a5-next-free-provider-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Probe Gemini 3.5 Flash-Lite availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo 'BLOCKED:GEMINI_API_KEY_MISSING'; exit 2; }
          node <<'NODE'
          (async()=>{
            const res=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
              method:'POST',
              headers:{
                'x-goog-api-key':process.env.GEMINI_API_KEY,
                'content-type':'application/json'
              },
              body:JSON.stringify({
                model:'gemini-3.5-flash-lite',
                input:'Reply with OK.',
                store:false
              }),
              signal:AbortSignal.timeout(30000)
            });
            let json={}; try{json=await res.json()}catch{}
            console.log('NEXT_FREE_PROVIDER_PROBE '+JSON.stringify({
              model:'gemini-3.5-flash-lite',
              status:res.status,
              response_status:json?.status??null,
              error_code:json?.error?.code??null,
              error_message:typeof json?.error?.message==='string'?json.error.message.slice(0,800):null
            }));
            if(!res.ok) process.exit(1);
          })().catch(e=>{
            console.error('NEXT_FREE_PROVIDER_PROBE_ERROR '+String(e?.name||'')+':'+String(e?.message||e));
            process.exit(1);
          });
          NODE
