name: M1A-5 Max Output Probe

on:
  push:
    branches:
      - m1a5-upstream-diagnostic-20260918
    paths:
      - '.github/workflows/m1a5-maxoutput-probe.yml'

permissions:
  contents: read

jobs:
  maxoutput-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 49d56e4585f0ab1a6b6fc550e3f2fe1651964371
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout exact current head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Wait for TPM reset and probe max_output_tokens 4096 once
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}" || { echo 'BLOCKED: GROQ_API_KEY_MISSING'; exit 2; }
          sleep 65
          node - <<'NODE'
          const {availability,bindingInput}=require('./delivery_runtime/tests/helpers');
          const {groqGenerationFormat,groqModelInstructions}=require('./delivery_runtime/lib/groq-binding');

          (async()=>{
            const bi=bindingInput(availability());
            const response=await fetch('https://api.groq.com/openai/v1/responses',{
              method:'POST',
              headers:{
                'authorization':'Bearer '+process.env.GROQ_API_KEY,
                'content-type':'application/json'
              },
              body:JSON.stringify({
                model:'openai/gpt-oss-120b',
                max_output_tokens:4096,
                instructions:groqModelInstructions(bi.availability,bi.verified_evidence),
                input:bi.semantic_input,
                text:{format:groqGenerationFormat(bi.verified_evidence,bi.availability)}
              }),
              signal:AbortSignal.timeout(70000)
            });
            let body={};
            try{body=await response.json();}catch{}
            const err=body&&typeof body==='object'?body.error:null;
            let outputText=typeof body.output_text==='string'?body.output_text:null;
            if(!outputText){
              for(const item of body.output||[]){
                for(const c of item.content||[]){
                  if(c.type==='output_text'&&typeof c.text==='string'){outputText=c.text;break;}
                }
                if(outputText)break;
              }
            }
            let parsed=false, keys=[];
            if(outputText){
              try{const p=JSON.parse(outputText);parsed=true;keys=Object.keys(p).sort();}catch{}
            }
            const safe={
              status:response.status,
              error_message:err?.message??null,
              error_type:err?.type??null,
              error_code:err?.code??null,
              response_status:body?.status??null,
              parsed,
              keys,
              limit_tokens:response.headers.get('x-ratelimit-limit-tokens'),
              remaining_tokens:response.headers.get('x-ratelimit-remaining-tokens'),
              reset_tokens:response.headers.get('x-ratelimit-reset-tokens')
            };
            console.log('SAFE_MAXOUTPUT_PROBE '+JSON.stringify(safe));
            if(response.status!==200 || !parsed) process.exit(1);
          })().catch((e)=>{
            console.error('PROBE_ERROR '+String(e?.name||'')+':'+String(e?.message||e));
            process.exit(1);
          });
          NODE
