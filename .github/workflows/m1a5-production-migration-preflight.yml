name: M1A-5 Production Migration Preflight

on:
  push:
    branches:
      - m1a5-root-repair-runtime-4608
    paths:
      - '.github/workflows/m1a5-production-migration-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROD_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GM_API_SECRET: ${{ secrets.GM_API_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Verify production migration credentials only
        shell: bash
        run: |
          set -euo pipefail
          for k in VERCEL_TOKEN VERCEL_ACCESS_TOKEN VERCEL_API_TOKEN VERCEL_PROD_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID GM_API_SECRET GEMINI_API_KEY; do
            if [ -n "${!k:-}" ]; then echo "$k=PASS"; else echo "$k=BLOCKED"; fi
          done
          TOKEN="${VERCEL_TOKEN:-${VERCEL_ACCESS_TOKEN:-${VERCEL_API_TOKEN:-${VERCEL_PROD_TOKEN:-}}}}"
          test -n "$TOKEN" || exit 2
          test -n "${GM_API_SECRET:-}" || exit 2
          test -n "${GEMINI_API_KEY:-}" || exit 2
